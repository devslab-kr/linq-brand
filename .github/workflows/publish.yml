name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # npm >= 11.5.1 is required for OIDC trusted publishing; older Node bundles npm 10
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "v$package_version" ]; then
            echo "Release tag $RELEASE_TAG does not match package version v$package_version" >&2
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null
          fi

      - run: npm ci
      - run: npm run generate
      - run: npm run validate
      - run: npm test
      - run: npm run pack:check

      # Auth is npm Trusted Publishing (OIDC): npm trusts this repo +
      # workflow file through `id-token: write`, so there is no NPM_TOKEN.
      # A token in NODE_AUTH_TOKEN would take precedence and bypass OIDC.
      - name: Publish to npm
        run: npm publish --access public --provenance
